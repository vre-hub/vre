apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reana
  namespace: reana
  annotations:
    flux.weave.works/automated: "false" 
   
spec:
  releaseName: reana
  interval: 5m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: reana
        namespace: reana
      chart: reana
      interval: 1m
      version: 0.9.3

  valuesFrom:
    - kind: Secret
      name: reana-vre-iam-client
      valuesKey: client_id
      targetPath: secrets.login.escape-iam.consumer_key
    - kind: Secret
      name: reana-vre-iam-client
      valuesKey: client_secret
      targetPath: secrets.login.escape-iam.consumer_secret
    - kind: Secret
      name: reana-db
      valuesKey: user
      targetPath: secrets.database.user
    - kind: Secret
      name: reana-db
      valuesKey: password
      targetPath: secrets.database.password	

  values:

    # Mount the CERN EOS namespace (the same /var/eos autofs tree already
    # exposed to JupyterHub singleuser pods, e.g. jhub-values.yaml) into every
    # REANA runtime job pod at /eos. This sets K8S_CERN_EOS_AVAILABLE=True on
    # reana-workflow-controller, which forwards it to the reana-job-controller
    # sidecar spawned for each workflow run, which in turn hostPath-mounts
    # /var/eos -> /eos (mountPropagation: HostToContainer) into every workflow
    # step pod. The eulake pilot data (eospilot.cern.ch) lands at /eos/pilot:
    # per kube-system/eos-csi-dir-etc-eos's fuse.pilot.conf, that mountpoint's
    # remotemountdir is already pinned to /eos/pilot/eulake/escape/data/ on
    # the eospilot instance (jhub just bind-mounts the same /var/eos/pilot
    # and additionally renames it to /eos/eulake in its own pods; this native
    # toggle exposes it under its real name, /eos/pilot, instead). Actual
    # read/write access is still governed by EOS's own ACLs, same as today.
    eos:
      enabled: true

    shared_storage:
      backend: cephfs
      volume_size: 1000
      access_modes: ReadWriteMany
      cephfs:
        provisioner: manila-provisioner
        type: "Meyrin CephFS"
        availability_zone: nova
        os_secret_name: os-trustee
        os_secret_namespace: kube-system
        cephfs_os_share_id: a6a85651-0b95-4e31-89ac-4ff31037f342
        cephfs_os_share_access_id: 1cd91c50-8cc6-449d-ae39-83249aca398b
        
    components:
      reana_ui:
        enabled: true
        local_users: false 
      reana_db:
        enabled: false
      reana_server:
        environment:
          REANA_USER_EMAIL_CONFIRMATION: false
      # reana_workflow_controller:
      #   image: docker.io/mdonadoni/reana-workflow-controller:0.9.1-7e03f0a-cvmfs
      # reana_job_controller:
      #   image: docker.io/reanahub/reana-job-controller-htcondorcern-slurmcern:0.9.1
        
    compute_backends: 
      - "kubernetes"
      - "htcondorcern"
      - "slurmcern"
    
    notifications:
      enabled: true 
      email_config:
        receiver: escape-cern-ops@cern.ch
        sender: escape-cern-ops@cern.ch
        login: ""
        smtp_server: cernmx.cern.ch
        smtp_port: 25

    reana_hostname: "reana-vre.cern.ch"
    
    db_env_config:
      REANA_DB_NAME: "reana"
      REANA_DB_PORT: "6600"
      REANA_DB_HOST: "dbod-vre.cern.ch"
      # There are two more environment variables that should be set in order
      # to connect to a database:
      # REANA_DB_USERNAME: containing the database user name.
      # REANA_DB_PASSWORD: containing the password for the user previously set.
      # Both environment variables should be set inside a Kubernetes secret:
      # `[release-name]-db`
  
    login:
      - name: "escape-iam"
        type: "keycloak"
        config:
          title: "ESCAPE IAM"
          base_url: "https://iam-escape.cloud.cnaf.infn.it"
          realm_url: "https://iam-escape.cloud.cnaf.infn.it" 
          auth_url: "https://iam-escape.cloud.cnaf.infn.it/authorize" 
          token_url: "https://iam-escape.cloud.cnaf.infn.it/token" 
          userinfo_url: "https://iam-escape.cloud.cnaf.infn.it/userinfo"

    ingress:
      enabled: false

    traefik:
      enabled: false

  # Root cause of the 2026-09-24 "login hangs forever" incident: a user's
  # oversized workflow workspace (tens of millions of bytes of directory
  # listing) took 15-30+ minutes to enumerate on the CephFS-backed shared
  # storage, and neither reana-server nor reana-workflow-controller had any
  # uWSGI harakiri timeout configured. A single such request could hold a
  # worker hostage indefinitely; once enough piled up (helped along by the
  # REANA UI's 15s auto-poll), the whole worker pool -- including completely
  # unrelated requests like OAuth login -- backed up for as long as the
  # slow request(s) ran, sometimes over an hour.
  #
  # This adds `harakiri = 120` (kill + respawn any single request running
  # longer than 120s) to both components, so one pathological request can no
  # longer wedge the whole server. It does not fix the underlying slow
  # workspace listing itself -- see the workspace cleanup tracked separately.
  postRenderers:
    - kustomize:
        patches:
          # reana-server: the uwsgi.ini ConfigMap doesn't expose harakiri via
          # Helm values, so replace its rendered content with the same
          # content plus two extra lines. Keep this in sync if the chart's
          # templates/uwsgi-config.yaml template ever changes.
          - target:
              kind: ConfigMap
              name: uwsgi-config
            patch: |-
              - op: replace
                path: /data/uwsgi.ini
                value: |
                  [uwsgi]
                  stats = /tmp/stats.socket
                  http = 0.0.0.0:5000
                  module = invenio_app.wsgi:application
                  master = true
                  processes = 6
                  threads = 4
                  enable-threads = true
                  single-interpreter = true
                  need-app = true
                  vacuum = true
                  wsgi-disable-file-wrapper = true

                  auto-procname = true
                  buffer-size =  10240
                  post-buffering = true
                  lazy-apps = true

                  # Logging

                  # Workers management
                  max-requests = 1999
                  max-requests-delta = 149
                  reload-on-rss = 250

                  # Kill + respawn any single request running longer than
                  # this instead of letting it hold a worker forever.
                  harakiri = 120
                  harakiri-verbose = true

                  # fix up signal handling
                  die-on-term = true
                  hook-master-start = unix_signal:2 gracefully_kill_them_all
                  hook-master-start = unix_signal:15 gracefully_kill_them_all

                  # enable keepalive to avoid 500/502 from traefik
                  http-keepalive = 1

                  # fix uWSGI memory consumption on systems with very high fs.nr_open limits
                  max-fd = 1048576
          # reana-workflow-controller: its uwsgi command/args aren't exposed
          # via Helm values at all -- they're baked into the container image's
          # own entrypoint (confirmed live: `uwsgi --processes 2 --threads 2
          # ...`, no ConfigMap involved). Kubernetes `command`/`args` fully
          # replace the image's CMD, so this must repeat the exact flags the
          # image already runs with (verified via `ps aux` in the live pod)
          # plus the two new harakiri flags. If reanahub ever changes this
          # image's default flags, this patch will silently keep the old
          # ones until updated here too.
          - target:
              kind: Deployment
              name: reana-workflow-controller
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/command
                value:
                  - uwsgi
              - op: add
                path: /spec/template/spec/containers/0/args
                value:
                  - --buffer-size
                  - "8192"
                  - --die-on-term
                  - --hook-master-start
                  - "unix_signal:2 gracefully_kill_them_all"
                  - --hook-master-start
                  - "unix_signal:15 gracefully_kill_them_all"
                  - --enable-threads
                  - --http-socket
                  - "0.0.0.0:5000"
                  - --master
                  - --max-fd
                  - "1048576"
                  - --module
                  - reana_workflow_controller.app:app
                  - --need-app
                  - --processes
                  - "2"
                  - --single-interpreter
                  - --stats
                  - /tmp/stats.socket
                  - --threads
                  - "2"
                  - --vacuum
                  - --wsgi-disable-file-wrapper
                  - --harakiri
                  - "120"
                  - --harakiri-verbose
                  - "true"
